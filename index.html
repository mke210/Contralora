<style>
:root{--navy:#1F3864;--navy2:#2B4A80;--gold:#C9A227;--bg:#F3F5F9;--card:#fff;--line:#E1E6EF;--txt:#1C2433;--mut:#6B7588;
--g:#1E8E4E;--gbg:#E3F5EA;--a:#B7791F;--abg:#FDF3DC;--r:#C0392B;--rbg:#FBE5E2;--p:#6D3FC0;--pbg:#EEE6FB;--n:#5E6675;--nbg:#ECEEF2;--rad:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;vertical-align:middle}
[hidden]{display:none!important}

/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,#13244A 60%,#0E1B38 100%)}
.lbox{background:#fff;width:100%;max-width:380px;border-radius:18px;padding:30px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
.lbox .logo{width:72px;height:72px;border-radius:18px;background:var(--navy);color:var(--gold);display:grid;place-items:center;margin:0 auto 12px}
.lbox h1{font-size:20px;margin:6px 0 2px;color:var(--navy)}
.lbox p{margin:0 0 20px;color:var(--mut);font-size:13px}
.lbox label{text-align:left}
#loginErr{color:var(--r);font-size:13px;min-height:18px;margin:6px 0}

/* Shell */
#app{display:flex;min-height:100%}
#side{width:240px;background:var(--navy);color:#DCE3F0;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .25s}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .bl{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.1}
.brand small{font-size:11px;opacity:.75}
#nav{flex:1;overflow:auto;padding:10px 8px}
#nav button{display:flex;gap:11px;align-items:center;width:100%;background:none;border:0;color:inherit;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:14.5px}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:rgba(201,162,39,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
#nav .bdg{margin-left:auto;background:var(--r);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.sfoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px}
.sfoot .who{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot .role{opacity:.7;margin-bottom:8px}
.sfoot button{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;margin:2px 0}
.sfoot .pw{opacity:.55;font-size:11px;margin-top:8px}
main{flex:1;margin-left:240px;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:19px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hamb{display:none}
.mode{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--abg);color:var(--a);font-weight:600;white-space:nowrap}
.mode.cloud{background:var(--gbg);color:var(--g)}
#view{padding:20px 22px 90px;max-width:1300px;width:100%}
#scrim{display:none}

/* Generic */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-size:14px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#C5CEDD;background:#FAFBFD}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1B1B;font-weight:600}
.btn.dan{color:var(--r);border-color:#F0C5BF}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
.icon-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--mut);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--nbg);color:var(--txt)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#3A4459}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{border:1px solid #CFD6E2;border-radius:9px;padding:9px 11px;background:#fff;font-size:14.5px;font-weight:400;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(31,56,100,.25);border-color:var(--navy)}
input[type=checkbox]{width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px;position:relative}
.toolbar .grow .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.toolbar .grow input{padding-left:34px}
.toolbar select{width:auto;max-width:200px}
.sp{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--nbg);color:var(--n);white-space:nowrap}
.pill.g{background:var(--gbg);color:var(--g)}.pill.a{background:var(--abg);color:var(--a)}.pill.r{background:var(--rbg);color:var(--r)}.pill.p{background:var(--pbg);color:var(--p)}.pill.n{background:var(--nbg);color:var(--n)}
.muted{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty .ic{color:#B9C2D3;margin-bottom:8px}
h3.sec{font-size:15px;color:var(--navy);margin:22px 0 10px;display:flex;align-items:center;gap:8px}

/* Table */
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--rad);overflow:auto}
table.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{background:#F7F9FC;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td{padding:10px 12px;border-bottom:1px solid #EEF1F6;vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt tbody tr.ck{cursor:pointer}
.rt tbody tr.ck:hover{background:#F8FAFD}
.rt .code{font-family:Consolas,"Roboto Mono",monospace;font-weight:700;color:var(--navy);white-space:nowrap}
.rt .sub{font-size:12px;color:var(--mut)}
.selbar{display:flex;gap:8px;align-items:center;background:#FFF8E1;border:1px solid #F1DFA4;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
.more{text-align:center;padding:14px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty b{min-width:34px;text-align:center}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;cursor:pointer;transition:.15s}
.kpi:hover{border-color:#C5CEDD;transform:translateY(-1px)}
.kpi .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.kpi .l{font-size:13px;color:var(--mut);margin-top:3px}
.kpi.r .v{color:var(--r)}.kpi.a .v{color:var(--a)}.kpi.g .v{color:var(--g)}.kpi.p .v{color:var(--p)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.bars .br{display:grid;grid-template-columns:minmax(90px,38%) 1fr 40px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.bars .br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .bt{height:10px;background:#EEF1F6;border-radius:6px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--navy);border-radius:6px}
.bars .br b{text-align:right}
.prog{height:10px;background:#EEF1F6;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--g)}
.welcome{background:linear-gradient(120deg,var(--navy),#2D4E8C);color:#fff;border-radius:var(--rad);padding:18px 20px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.welcome h3{margin:0;font-size:18px}
.welcome p{margin:3px 0 0;opacity:.8;font-size:13.5px}
.welcome .btn{margin-left:auto}

/* Cards grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ec{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:8px}
.ec h4{margin:0;font-size:16px;color:var(--navy)}
.ec .meta{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.ec .meta span{display:flex;gap:6px;align-items:center}
.ec .stats{display:flex;gap:6px;flex-wrap:wrap}
.ec .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px;border-top:1px solid #EEF1F6}
.nc{border-left:4px solid var(--n)}
.nc.Alta{border-left-color:var(--r)}.nc.Media{border-left-color:var(--a)}
.nc p{margin:0;font-size:14px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,22,40,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.modal.wide{max-width:820px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:17px;flex:1;color:var(--navy)}
.mb{padding:18px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .c2{grid-column:1/-1}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px}
.ctab th,.ctab td{border-bottom:1px solid #EEF1F6;padding:6px 4px;text-align:left}
.ctab .rg{display:flex;gap:4px}
.ctab .rg label{flex-direction:row;align-items:center;gap:3px;font-weight:600;font-size:12.5px}
.ctab input[type=text]{padding:6px 8px;font-size:13.5px}

/* Ficha */
.ficha{display:grid;grid-template-columns:200px 1fr;gap:20px}
.fq{text-align:center}
.fq svg{width:180px;height:180px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.fcode{font-family:Consolas,monospace;font-weight:700;font-size:20px;color:var(--navy);margin-top:6px}
#fFoto img{width:180px;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.fd h2{margin:0 0 8px;font-size:21px}
.fd .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fd dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.fd dt{color:var(--mut)}
.fd dd{margin:0;font-weight:500}
.hist{max-height:220px;overflow:auto;font-size:13.5px}
.hist div{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.hist time{color:var(--mut);white-space:nowrap;font-size:12.5px;min-width:96px}

/* Scanner */
.scanw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
#reader{width:100%;min-height:260px;background:#0E1B38;border-radius:var(--rad);overflow:hidden;display:grid;place-items:center;color:#9FB0D0}
#reader video{width:100%!important;border-radius:var(--rad)}
.slist{max-height:420px;overflow:auto}
.slist div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF1F6;font-size:14px}
.flash{animation:fl .6s}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(30,142,78,.7)}100%{box-shadow:0 0 0 18px rgba(30,142,78,0)}}

/* Labels (screen + print) */
.sheet{display:flex;flex-wrap:wrap;gap:2mm;align-content:flex-start}
.lbl{display:flex;gap:2mm;align-items:center;border:.3mm dashed #9AA3B2;padding:1.5mm;background:#fff;color:#000;overflow:hidden;break-inside:avoid;page-break-inside:avoid;font-family:Arial,sans-serif}
.lbl .lq svg{display:block}
.lbl .lt{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.lbl .ls{font-size:5.5pt;font-weight:700;text-transform:uppercase;color:#1F3864;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .lc{font-family:Consolas,"Courier New",monospace;font-weight:700;letter-spacing:.2px}
.lbl .ld,.lbl .le{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.lbl .le{color:#444}
.lbl.S{width:45mm;height:25mm}.lbl.S .lq svg{width:21mm;height:21mm}.lbl.S .lc{font-size:9pt}.lbl.S .ld{font-size:6pt}.lbl.S .le{font-size:5.5pt;-webkit-line-clamp:1}
.lbl.M{width:64mm;height:34mm}.lbl.M .lq svg{width:30mm;height:30mm}.lbl.M .ls{font-size:6.5pt}.lbl.M .lc{font-size:12pt}.lbl.M .ld{font-size:7.5pt}.lbl.M .le{font-size:6.5pt}
.lbl.L{width:92mm;height:46mm}.lbl.L .lq svg{width:41mm;height:41mm}.lbl.L .ls{font-size:8pt}.lbl.L .lc{font-size:16pt}.lbl.L .ld{font-size:10pt}.lbl.L .le{font-size:8.5pt}
.prev{background:#E9EDF3;border-radius:var(--rad);padding:16px;overflow:auto;max-height:70vh}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#1C2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fi .2s;max-width:90vw}
#toast div.err{background:var(--r)}#toast div.ok{background:var(--g)}
#fab{display:none}
#printArea{display:none}

/* Responsive */
@media(max-width:900px){
 #side{transform:translateX(-100%)}
 body.nav-open #side{transform:none}
 body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
 main{margin-left:0}
 #hamb{display:inline-grid}
 .top{padding:10px 12px}
 #view{padding:14px 12px 100px}
 .grid2,.scanw{grid-template-columns:1fr}
 #fab{display:grid;place-items:center;position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--navy);border:0;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:25;cursor:pointer}
}
@media(max-width:640px){
 .fg{grid-template-columns:1fr}
 .ficha{grid-template-columns:1fr}
 .toolbar select{max-width:none;flex:1 1 45%}
 .modal-bg{padding:0}
 .modal{border-radius:0;min-height:100%}
 table.rt thead{display:none}
 table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
 table.rt tr{border-bottom:8px solid var(--bg);padding:6px 0}
 table.rt td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 12px;text-align:right}
 table.rt td::before{content:attr(data-l);font-weight:600;color:var(--mut);font-size:12.5px;text-align:left}
 table.rt td[data-l=""]::before{content:none}
 .welcome .btn{margin-left:0}
}

/* Print */
@media print{
 @page{size:letter;margin:10mm}
 body{background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 .lbl{border-color:#BBB}
}
#printArea,#printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea.rep{font-family:Arial,sans-serif;color:#000;font-size:10pt}
.rep h1{font-size:13pt;text-align:center;margin:0}
.rep .sub{text-align:center;font-size:9pt;margin:0 0 8px}
.rep h2{font-size:11.5pt;text-align:center;color:#1F3864;margin:8px 0 10px}
.rep h3{font-size:10.5pt;color:#1F3864;border-bottom:1.5px solid #1F3864;padding-bottom:2px;margin:14px 0 6px;break-after:avoid}
.rep h4{font-size:10pt;margin:10px 0 4px;break-after:avoid}
.rep table{width:100%;border-collapse:collapse;margin-bottom:6px}
.rep th{background:#1F3864;color:#fff;font-size:8.5pt;padding:4px;border:1px solid #808080}
.rep td{border:1px solid #808080;padding:3px 5px;font-size:9pt;vertical-align:top}
.rep td.k{background:#DCE3F0;font-weight:700;width:22%}
.rep tr{break-inside:avoid}
.rep .firmas{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px;text-align:center;font-size:9pt;break-inside:avoid}
.rep .firmas div{border-top:1px solid #000;padding-top:4px}
.rep .decl{font-style:italic;margin-top:14px;font-size:9pt;text-align:justify}
.rep p{margin:4px 0}
</style>

/* ---------- QR ---------- */
function qrSVG(text){
 if(typeof qrcode==='undefined')return'<svg viewBox="0 0 10 10"><text x="1" y="6" font-size="2">QR</text></svg>';
 const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
 return`<svg viewBox="-2 -2 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function qrContent(code){const c=cfg();return(c.qrModo==='codigo'||!/^https?:\/\//.test(c.urlBase))?code:c.urlBase.replace(/#.*$/,'')+'#b='+encodeURIComponent(code)}
function parseCode(t){t=String(t||'').trim();const m=t.match(/[#?&]b=([^&\s]+)/);return(m?decodeURIComponent(m[1]):t).toUpperCase()}

const DB={
 mode:'local',data:{},ls:{},
 on(c,f){(this.ls[c]??=[]).push(f)},
 emit(c){(this.ls[c]||[]).forEach(f=>f(c));(this.ls['*']||[]).forEach(f=>f(c))},
 ref(p){return fdb.ref(ROOT+(p?'/'+p:''))},
 save(){try{localStorage.setItem(LSKEY,JSON.stringify(this.data))}catch(e){toast('El navegador se quedó sin espacio. Exporta un respaldo y considera activar la nube (Firebase).','err')}},
 start(){
  if(this.mode==='local'){try{this.data=JSON.parse(localStorage.getItem(LSKEY)||'{}')}catch(e){this.data={}}COLS.forEach(c=>{S[c]=this.data[c]||{};LOADED.add(c);this.emit(c)})}
  else COLS.forEach(c=>this.ref(c).on('value',sn=>{S[c]=sn.val()||{};LOADED.add(c);this.emit(c)},e=>{console.warn(c,e);if(c!=='usuarios')toast('Sin permiso para leer '+c+'. Revisa las reglas de Firebase.','err')}));
 },
 stop(){if(this.mode!=='local'&&fdb)COLS.forEach(c=>this.ref(c).off())},
 _lset(p,v){const k=p.split('/');let o=this.data;for(let i=0;i<k.length-1;i++){if(!o[k[i]]||typeof o[k[i]]!=='object')o[k[i]]={};o=o[k[i]]}if(v==null)delete o[k.at(-1)];else o[k.at(-1)]=clean(v)},
 _lget(p){return p?p.split('/').reduce((o,k)=>o==null?undefined:o[k],this.data):this.data},
 _touch(paths){this.save();new Set(paths.map(p=>p.split('/')[0])).forEach(c=>{if(c in S)S[c]=this.data[c]||{};this.emit(c)})},
 async set(p,v){if(this.mode==='local'){this._lset(p,v);this._touch([p])}else await this.ref(p).set(clean(v))},
 async update(p,o){o=clean(o);if(this.mode==='local'){Object.entries(o).forEach(([k,v])=>this._lset(p+'/'+k,v));this._touch([p])}else await this.ref(p).update(o)},
 async multi(o){o=clean(o);if(this.mode==='local'){Object.entries(o).forEach(([k,v])=>this._lset(k,v));this._touch(Object.keys(o))}else await this.ref('').update(o)},
 remove(p){return this.set(p,null)},
 async get(p){if(this.mode==='local')return clean(this._lget(p)??null);return(await this.ref(p).once('value')).val()},
 async push(p,v){const id=this.mode==='local'?uid():this.ref(p).push().key;await this.set(p+'/'+id,v);return id},
 async reserve(p,n){if(this.mode==='local'){const c=this._lget(p)||0;this._lset(p,c+n);this.save();return c+1}const r=await this.ref(p).transaction(c=>(c||0)+n);return r.snapshot.val()-n+1}

let SCN=null,SCLAST={c:'',t:0},SESS=[];
function vEscanear(){
 const adm=isAdmin();
 $('#view').innerHTML=`<div class="scanw"><div>
  <div class="card" style="margin-bottom:12px"><div class="fg">
   <label class="c2">Modo<select id="scMode">${opts([['ver','Ver ficha del bien'],...(canEdit()?[['verificar','Levantamiento: marcar como verificado']]:[]),...(adm?[['asignar','Asignar / trasladar a un espacio']]:[])],'ver')}</select></label>
   <label class="c2" id="scEspW" hidden>Espacio destino<select id="scEsp">${espOpts('','— Elegir espacio —')}</select><small>Cada bien que escanees se moverá a este espacio y quedará bajo el resguardo de su responsable.</small></label></div></div>
  <div id="reader"><div style="text-align:center;padding:20px">${ic('camera',44)}<p>La cámara se activa al presionar el botón.</p></div></div>
  <div class="toolbar" style="margin-top:10px"><button class="btn pri" id="scGo">${ic('camera')} Activar cámara</button><button class="btn" id="scStop" hidden>Detener</button></div>
  <form class="toolbar" id="scMan"><input id="scCode" placeholder="O escribe el código, ej. BM-0001" style="flex:1"><button class="btn">Buscar</button></form>
 </div>
 <div class="card"><div style="display:flex;align-items:center;gap:8px"><b>Escaneados en esta sesión</b><span class="pill n" id="scN">0</span><span class="sp"></span><button class="btn sm" id="scClr">Limpiar</button></div><div class="slist" id="scList"></div></div></div>`;
 $('#scMode').onchange=()=>{$('#scEspW').hidden=$('#scMode').value!=='asignar'};
 $('#scGo').onclick=startScanner;$('#scStop').onclick=stopScanner;
 $('#scMan').onsubmit=e=>{e.preventDefault();const v=$('#scCode').value;if(v.trim()){handleScan(v);$('#scCode').value=''}};
 $('#scClr').onclick=()=>{SESS=[];drawSess()};
 drawSess();VIEWS.escanear.refresh=drawSess;
}
function drawSess(){const l=$('#scList');if(!l)return;$('#scN').textContent=SESS.length;l.innerHTML=SESS.length?SESS.map(s=>`<div>${s.ok?`<span style="color:var(--g)">${ic('check',16)}</span>`:`<span style="color:var(--r)">${ic('x',16)}</span>`}<span class="code" style="font-family:Consolas,monospace;font-weight:700;color:var(--navy)">${esc(s.c)}</span><span style="flex:1;min-width:0">${esc(s.d)}</span><time class="muted" style="font-size:12px">${new Date(s.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</time></div>`).join(''):'<div class="muted" style="border:0">Aún no has escaneado nada.</div>'}
async function startScanner(){
 if(!window.isSecureContext){toast('La cámara requiere abrir la app con https (por ejemplo desde GitHub Pages).','err');return}
 try{$('#scGo').disabled=true;await loadScript(H5Q);$('#reader').innerHTML='';SCN=new Html5Qrcode('reader',{verbose:false});
  await SCN.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.7);return{width:s,height:s}}},t=>handleScan(t),()=>{});
  $('#scGo').hidden=true;$('#scStop').hidden=false;
 }catch(e){console.error(e);SCN=null;toast(String(e.message||e).includes('Permission')||String(e).includes('NotAllowed')?'Permite el acceso a la cámara en el navegador.':'No se pudo abrir la cámara: '+(e.message||e),'err')}
 finally{if($('#scGo'))$('#scGo').disabled=false}
}
function stopScanner(){if(SCN){const s=SCN;SCN=null;s.stop().then(()=>s.clear()).catch(()=>{})}if($('#scGo')){$('#scGo').hidden=false;$('#scStop').hidden=true}}
async function handleScan(text){
 const code=parseCode(text),now=Date.now();if(code===SCLAST.c&&now-SCLAST.t<3000)return;SCLAST={c:code,t:now};
 const mode=$('#scMode')?.value||'ver',b=S.bienes[code];
 if(!b){beep(false);SESS.unshift({c:code,d:'No registrado',ok:false,t:now});drawSess();toast(`${code} no está registrado`,'err');return}
 if(mode==='ver'){beep(true);stopScanner();ficha(code);return}
 if(mode==='verificar'){if(!canEditB(b)){beep(false);toast('Fuera de tu resguardo','err');return}await verificar(code);beep(true);SESS.unshift({c:code,d:`${b.descripcion} · ${espName(b.espacioId)}`,ok:true,t:now})}
 if(mode==='asignar'){const e=$('#scEsp').value;if(!e){beep(false);toast('Primero elige el espacio destino','err');return}
  const r=S.espacios[e]?.responsableId||b.responsableId||'';const d={espacioId:e,responsableId:r,ultimaVerif:now,verifPor:ME.nombre};
  await DB.update('bienes/'+code,d);await logChanges(code,b,d);beep(true);SESS.unshift({c:code,d:`${b.descripcion} → ${espName(e)}`,ok:true,t:now})}
 drawSess();const rd=$('#reader');if(rd){rd.classList.remove('flash');void rd.offsetWidth;rd.classList.add('flash')}
}

function repHead(title){const c=cfg();return`<h1>${esc(c.escuela.toUpperCase())}</h1><p class="sub">${esc(c.direccion)}${c.cct?' · CCT '+esc(c.cct):''} · Ciclo escolar ${esc(c.ciclo)}</p><h2>${title}</h2>`}

function condTable(e){const c=e.condiciones||{},k=Object.keys(c);return k.length?`<table><tr><th>Elemento</th><th style="width:60px">Estado</th><th>Descripción</th></tr>${k.map(x=>`<tr><td>${esc(x)}</td><td style="text-align:center">${{B:'Bueno',R:'Regular',M:'Malo'}[c[x].e]||'—'}</td><td>${esc(c[x].d||'')}</td></tr>`).join('')}</table>`:'<p><i>Condiciones no registradas.</i></p>'}
function necTable(N){return N.length?`<table><tr><th>No.</th><th>Necesidad detectada</th><th>Tipo</th><th>Prioridad</th><th>Estado</th></tr>${N.map((n,i)=>`<tr><td>${i+1}</td><td>${esc(n.descripcion)}${n.bienCodigo?` (${esc(n.bienCodigo)})`:''}</td><td>${esc(n.tipo)}</td><td>${esc(n.prioridad)}</td><td>${esc(n.estado)}</td></tr>`).join('')}</table>`:'<p><i>Sin necesidades registradas.</i></p>'}

function informeBajas(codes,desde,hasta){

function boot(){
 $('#lgIcon').innerHTML=ic('qr',40);$('#brIcon').innerHTML=ic('qr',22);$('#hamb').innerHTML=ic('menu',22);$('#fab').innerHTML=ic('scan',26);
 $('#btnOut').innerHTML=ic('logout',15)+' Cerrar sesión';$('#btnInstall').innerHTML=ic('install',15)+' Instalar app';
 $('#hamb').onclick=()=>document.body.classList.toggle('nav-open');$('#scrim').onclick=()=>document.body.classList.remove('nav-open');
 $('#fab').onclick=()=>go('escanear');
 readHash();window.addEventListener('hashchange',readHash);
 const useCloud=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL&&window.firebase);
 if(!useCloud){
  DB.mode='local';ME={uid:'local',nombre:'Contraloría',rol:'admin',email:''};
  $('#btnOut').hidden=true;DB.start();startApp();return;
 }
 DB.mode='firebase';firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.database();
 $('#btnOut').onclick=async()=>{if(await confirmDlg('¿Cerrar sesión?','Cerrar sesión')){DB.stop();ME=null;await firebase.auth().signOut();location.reload()}};
 $('#lgForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').textContent='';const b=$('#lgForm .btn.pri');b.disabled=true;
  try{await firebase.auth().signInWithEmailAndPassword($('#lgEmail').value.trim(),$('#lgPass').value)}catch(err){$('#loginErr').textContent=authMsg(err)}finally{b.disabled=false}};
 $('#lgReset').onclick=async()=>{const em=$('#lgEmail').value.trim();if(!em){$('#loginErr').textContent='Escribe tu correo y vuelve a presionar.';return}try{await firebase.auth().sendPasswordResetEmail(em);$('#loginErr').style.color='var(--g)';$('#loginErr').textContent='Te enviamos un correo para cambiar la contraseña.'}catch(err){$('#loginErr').textContent=authMsg(err)}};
 firebase.auth().onAuthStateChanged(async u=>{
  if(!u){$('#app').hidden=true;$('#login').hidden=false;return}
  try{
   let rec=(await fdb.ref(ROOT+'/usuarios/'+u.uid).once('value')).val();
   if(!rec){const any=(await fdb.ref(ROOT+'/usuarios').limitToFirst(1).once('value')).exists();
    if(any){$('#loginErr').textContent='Tu cuenta no tiene acceso a esta app. Pide al administrador que te dé de alta.';await firebase.auth().signOut();return}
    rec={email:u.email,nombre:u.email.split('@')[0],rol:'admin',activo:true,creado:Date.now()};await fdb.ref(ROOT+'/usuarios/'+u.uid).set(rec);toast('Eres el primer usuario: quedaste como administrador','ok')}
   if(rec.activo===false){$('#loginErr').textContent='Tu usuario está desactivado.';await firebase.auth().signOut();return}
   ME={uid:u.uid,...rec};
   fdb.ref(ROOT+'/usuarios/'+u.uid).on('value',sn=>{const v=sn.val();if(!v||v.activo===false){firebase.auth().signOut().then(()=>location.reload());return}const ch=v.rol!==ME.rol||v.responsableId!==ME.responsableId;ME={uid:u.uid,...v};if(ch){buildNav();go(CUR)}});
   DB.start();startApp();
  }catch(err){console.error(err);$('#loginErr').textContent='No se pudo leer la base de datos. Revisa las reglas de Realtime Database. ('+(err.code||err.message)+')';await firebase.auth().signOut()}
 });
}

/* PWA */
let DEFP=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFP=e;const b=$('#btnInstall');b.hidden=false;b.onclick=async()=>{DEFP.prompt();await DEFP.userChoice;DEFP=null;b.hidden=true}});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML=''});
boot();
</script>
</body>
</html>
